name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  proxy:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt
      - run: python -B -m unittest discover -s tests -v
      - run: python -B claude_clean.py --selftest
      - name: Compile the on-device monitor from source
        if: runner.os == 'Linux' && matrix.python == '3.12'
        shell: bash
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
          python android/build.py
      - name: Parse PowerShell scripts without executing them
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $failed = $false
          Get-ChildItem -File -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { $errors | ForEach-Object { Write-Error $_ }; $failed = $true }
          }
          if ($failed) { exit 1 }
      - name: Test SakuraCat launch prompts and local proxy checks
        if: runner.os == 'Windows' && matrix.python == '3.12'
        shell: powershell
        run: .\tests\sakuracat-preflight.ps1
      - name: Exercise Chrome guard on disposable Windows runner
        if: runner.os == 'Windows' && matrix.python == '3.12'
        timeout-minutes: 4
        shell: powershell
        run: .\tests\web-guard-ci.ps1
